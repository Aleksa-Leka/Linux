# Supported releases: Ubuntu Desktop 24.04 LTS (noble) and 26.04 LTS (resolute), amd64
version: 1

user-data:
  # Hidden IT admin account. UID < 1000 + SystemAccount=true (see late-commands)
  # hides it from the GDM user list, so gnome-initial-setup still runs on first
  # boot and the device owner creates their own account there.
  # Owner is demoted to a standard user by the first-login script (least privilege).
  # Log in as admin via "Not listed?" on the login screen, or use su/sudo.
  users:
    - name: itadmin
      gecos: IT Admin
      uid: 900
      groups: [sudo]
      shell: /bin/bash
      lock_passwd: false
      # SHA-512 crypt hash; regenerate with: openssl passwd -6
      hashed_passwd: "$6$ffU5FpeffnfX4ORI$0SzRJ50PftwdXG1.roU9TFs/xxuG2REx05ix/VHhqzXsYiK.itwDT/TZSarINdJlKfUhFd/425TdBqRRuaqpC1"
  disable_root: false

ssh:
  install-server: no

storage:
  layout:
    name: lvm
    password: ubuntu   # Need to be equal with the Script, need to be changed from the User

# keyboard:
#   layout: de
# locale: en_US
# timezone: Europe/Berlin
updates: security
shutdown: reboot

# Mandatory Packages for installing the Intune Requierments
packages:
  - curl
  - git
  - wget
  - gpg
  - zenity   # Used by the LUKS first-boot dialog, not guaranteed on every desktop seed

snaps: # (Optional) Install additional apps from this catalog: https://snapcraft.io/store
  - name: code
    classic: true
  - name: postman
  - name: powershell
    classic: true
  - name: sublime-text
    classic: true

late-commands:
###########################################################################
# Start - LUKS first-boot password-change (GUI, post-login) ───────────────
###########################################################################
  #
  # Approach: two-script design
  #   luks-change-password-ui.sh   — runs as the logged-in user, shows
  #                                   zenity dialogs, validates input
  #   luks-change-password-root.sh — runs as root via sudo (NOPASSWD),
  #                                   performs the actual cryptsetup call
  #
  # Triggered by /etc/xdg/autostart on first desktop login.
  # Guard file /var/lib/luks-firstboot is removed on success.

  # User-facing UI script
  - |
    cat > /target/usr/local/bin/luks-change-password-ui.sh << 'SCRIPT'
    #!/bin/bash

    # Exit silently if already completed
    [ ! -f /var/lib/luks-firstboot ] && exit 0

    export DISPLAY="${DISPLAY:-:0}"
    export DBUS_SESSION_BUS_ADDRESS="${DBUS_SESSION_BUS_ADDRESS:-unix:path=/run/user/$(id -u)/bus}"

    # Opening info dialog — user cannot skip this
    zenity --info \
      --title="Disk Encryption Setup" \
      --width=420 \
      --text="<b>You must set a permanent disk encryption password.</b>\n\nThe installer used a temporary password that must be replaced before this device can be used.\n\nYou cannot skip this step."

    while true; do

      NEW_PASS=$(zenity --password \
        --title="Set Encryption Password" \
        --text="Enter your new encryption password (minimum 12 characters):")

      # User closed dialog — re-show info and loop, cannot escape
      if [ $? -ne 0 ]; then
        zenity --warning \
          --title="Required" \
          --text="Setting an encryption password is required.\nPlease complete this step."
        continue
      fi

      if [ ${#NEW_PASS} -lt 12 ]; then
        zenity --error \
          --title="Password Too Short" \
          --text="The password must be at least 12 characters.\nPlease try again."
        continue
      fi

      CONFIRM=$(zenity --password \
        --title="Confirm Encryption Password" \
        --text="Confirm your new encryption password:")

      if [ $? -ne 0 ]; then
        continue
      fi

      if [ "$NEW_PASS" != "$CONFIRM" ]; then
        zenity --error \
          --title="Passwords Do Not Match" \
          --text="The passwords you entered do not match.\nPlease try again."
        continue
      fi

      break
    done

    # Hand off to root script via sudo (NOPASSWD rule, stdin pipe)
    # printf instead of echo: echo would misinterpret passwords like "-n..." or "-e..."
    printf '%s\n' "$NEW_PASS" | sudo /usr/local/bin/luks-change-password-root.sh
    RESULT=$?

    if [ $RESULT -eq 0 ]; then
      zenity --info \
        --title="Encryption Password Set" \
        --width=380 \
        --text="<b>Your encryption password has been set successfully.</b>\n\nThis prompt will not appear again.\n\nYour account is a standard (non-administrator) account. Please log out and back in at a convenient time to apply this."

        gtk-launch intune-portal
    else
      zenity --error \
        --title="Error" \
        --text="Failed to change the encryption password.\nYou will be prompted again on next login."
    fi
    SCRIPT

  - chmod 0755 /target/usr/local/bin/luks-change-password-ui.sh

  # Root script — only called by the UI script via sudo
  - |
    cat > /target/usr/local/bin/luks-change-password-root.sh << 'SCRIPT'
    #!/bin/bash

    # Only allowed while the first-boot change is still pending
    [ -f /var/lib/luks-firstboot ] || { echo "ERROR: first-boot password change already done" >&2; exit 1; }

    # Read new password from stdin (piped from UI script).
    # IFS= keeps leading/trailing spaces, -r keeps backslashes.
    IFS= read -r NEW_PASS

    if [ ${#NEW_PASS} -lt 12 ]; then
      echo "ERROR: password shorter than 12 characters" >&2
      exit 1
    fi

    # Least privilege: the first account created by gnome-initial-setup is an
    # administrator. Demote the calling user to a standard user (never the IT
    # admin or root). Idempotent, takes effect at the user's next login.
    ADMIN_USER="itadmin"
    if [ -n "$SUDO_USER" ] && [ "$SUDO_USER" != "root" ] && [ "$SUDO_USER" != "$ADMIN_USER" ]; then
      for grp in sudo admin; do
        if id -nG "$SUDO_USER" | tr ' ' '\n' | grep -qx "$grp"; then
          gpasswd -d "$SUDO_USER" "$grp" >/dev/null
        fi
      done
    fi

    # Resolve the LUKS backing device
    LUKS_DEV=$(lsblk -rno NAME,TYPE | awk '$2=="crypt"{print $1}' | head -1)
    DEVICE=$(cryptsetup status "$LUKS_DEV" 2>/dev/null | awk '/device:/{print $2}')

    if [ -z "$DEVICE" ]; then
      echo "ERROR: Could not determine LUKS device" >&2
      exit 1
    fi

    # Change the LUKS key: use printf '%s' to avoid trailing newline on both
    # the old key (stdin) and new key (process substitution) — echo appends \n
    # which gets stored as part of the key, causing boot-time password mismatch.
    printf '%s' "ubuntu" | cryptsetup luksChangeKey "$DEVICE" <(printf '%s' "$NEW_PASS")

    if [ $? -eq 0 ]; then
      rm -f /var/lib/luks-firstboot
      exit 0
    else
      exit 1
    fi
    SCRIPT

  - chmod 0700 /target/usr/local/bin/luks-change-password-root.sh

  # Sudoers rule — NOPASSWD only for this specific script, nothing else
  - |
    cat > /target/etc/sudoers.d/luks-change-password << 'EOF'
    ALL ALL=(root) NOPASSWD: /usr/local/bin/luks-change-password-root.sh
    EOF

  - chmod 0440 /target/etc/sudoers.d/luks-change-password

  # Autostart desktop entry — triggers on first GUI login for any user
  - mkdir -p /target/etc/xdg/autostart

  - |
    cat > /target/etc/xdg/autostart/luks-change-password.desktop << 'EOF'
    [Desktop Entry]
    Type=Application
    Name=Disk Encryption Setup
    Comment=Set permanent LUKS encryption password on first login
    Exec=/usr/local/bin/luks-change-password-ui.sh
    X-GNOME-Autostart-enabled=true
    X-GNOME-Autostart-Delay=5
    NotifyStartup=false
    EOF

  # Marker file — removed by root script on success
  - touch /target/var/lib/luks-firstboot

  # ── Hide IT admin from the login screen + keep first-boot account setup ─
  - mkdir -p /target/var/lib/AccountsService/users
  - printf '[User]\nSystemAccount=true\n' > /target/var/lib/AccountsService/users/itadmin
  - chmod 0600 /target/var/lib/AccountsService/users/itadmin
  - curtin in-target --target=/target -- sh -c 'grep -q "^InitialSetupEnable" /etc/gdm3/custom.conf || sed -i "/^\[daemon\]/a InitialSetupEnable=true" /etc/gdm3/custom.conf'
  ###########################################################################
  # End - LUKS first-boot password-change (GUI, post-login) ───────────────
  ###########################################################################

  # ── Disable Ubuntu telemetry prompt ─────────────────────────────────────
  # 24.04 ships ubuntu-report; 26.04 replaces it with ubuntu-insights.
  - curtin in-target --target=/target -- sh -c 'if command -v ubuntu-report >/dev/null 2>&1; then ubuntu-report send no; fi'
  - curtin in-target --target=/target -- sh -c 'if command -v ubuntu-insights >/dev/null 2>&1; then ubuntu-insights consent --state=false || true; fi'

  # ── Disable GNOME initial setup wizard + Ubuntu Pro prompt ───────────────
  # Keep the package installed and skip only the pages listed below.
  # The account-creation page is intentionally NOT skipped: no user is
  # created during install, so the first user is created here on first boot
  # (gnome-initial-setup makes that first account an administrator / sudo member).
  - mkdir -p /target/etc/gnome-initial-setup
  - curtin in-target --target=/target -- sh -c 'echo "[pages]" > /etc/gnome-initial-setup/vendor.conf'
  - curtin in-target --target=/target -- sh -c 'echo "skip=language;keyboard;privacy;software;parental-controls;ubuntu-pro" >> /etc/gnome-initial-setup/vendor.conf'
  - curtin in-target --target=/target -- systemctl mask ubuntu-advantage-desktop-daemon

  # - mkdir -p /target/etc/skel/.config
  # - touch /target/etc/skel/.config/gnome-initial-setup-done

  # Also disable Ubuntu Pro background notifications (apt_news, MOTD ads)
  - curtin in-target --target=/target -- pro config set apt_news=false

  # ── Install Microsoft Intune Portal + Edge ───────────────────────────────
  # The release and codename are read from the installed system so the
  # matching packages.microsoft.com repo is used:
  #   24.04 → ubuntu/24.04/prod noble     (signed with microsoft.asc)
  #   26.04 → ubuntu/26.04/prod resolute  (signed with microsoft-2025.asc)
  # The Edge repo is signed with the legacy microsoft.asc key on all releases.
  - curtin in-target --target=/target -- mkdir -p /tmp/microsoft
  - curtin in-target --target=/target -- sh -c 'curl -sSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > /tmp/microsoft/microsoft.gpg'
  - curtin in-target --target=/target -- install -o root -g root -m 644 /tmp/microsoft/microsoft.gpg /usr/share/keyrings/microsoft.gpg
  - curtin in-target --target=/target -- sh -c 'curl -sSL https://packages.microsoft.com/keys/microsoft-2025.asc | gpg --dearmor > /tmp/microsoft/microsoft-2025.gpg'
  - curtin in-target --target=/target -- install -o root -g root -m 644 /tmp/microsoft/microsoft-2025.gpg /usr/share/keyrings/microsoft-2025.gpg

  - |
    curtin in-target --target=/target -- sh -c '
      . /etc/os-release
      case "$VERSION_ID" in
        24.04) KEYRING=/usr/share/keyrings/microsoft.gpg ;;
        26.04) KEYRING=/usr/share/keyrings/microsoft-2025.gpg ;;
        *) echo "Unsupported Ubuntu release for Intune: $VERSION_ID" >&2; exit 1 ;;
      esac
      echo "deb [arch=amd64 signed-by=$KEYRING] https://packages.microsoft.com/ubuntu/$VERSION_ID/prod $VERSION_CODENAME main" > "/etc/apt/sources.list.d/microsoft-ubuntu-$VERSION_CODENAME-prod.list"
    '

  - curtin in-target --target=/target -- sh -c 'echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/edge stable main" > /etc/apt/sources.list.d/microsoft-edge.list'

  - curtin in-target --target=/target -- apt-get update
  - curtin in-target --target=/target -- apt-get install -y intune-portal microsoft-edge-stable

  # NOTE: verify on a test machine that Edge updates still work after this
  # cleanup; the Edge package may add its own repo entry that relies on the key below.
  - rm -f /target/etc/apt/sources.list.d/microsoft-edge-dev.list
  - rm -f /target/etc/apt/trusted.gpg.d/microsoft.gpg
  - curtin in-target --target=/target -- rm -rf /tmp/microsoft

  # Remove bloatware
  - curtin in-target --target=/target -- apt-get purge -y 'libreoffice*' 'remmina*' 'transmission*'

  # Clean up
  - curtin in-target --target=/target -- apt-get autoremove -y
  - curtin in-target --target=/target -- apt-get clean
